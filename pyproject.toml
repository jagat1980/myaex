[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-graph"
version = "0.1.0"
description = "Estate Context Graph for BigFix AEX Agentic Remediation POC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "azure-identity>=1.16.0",
    "azure-mgmt-resourcegraph>=8.0.0",
    "neo4j>=5.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["connectors", "resolver", "writer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["connectors", "resolver", "writer", "evals"]
