name: CI - Application Containers & Security Gates

on:
  push:
    branches: [ main ]
    paths:
      - 'connectors/**'
      - 'mcp/**'
      - 'resolver/**'
      - 'writer/**'
      - 'risk/**'
      - 'Dockerfile*'
      - 'writer/Dockerfile'
      - 'pyproject.toml'
      - '.github/workflows/ci-containers.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'connectors/**'
      - 'mcp/**'
      - 'resolver/**'
      - 'writer/**'
      - 'risk/**'
      - 'Dockerfile*'
      - 'writer/Dockerfile'
      - 'pyproject.toml'
      - '.github/workflows/ci-containers.yml'

permissions:
  id-token: write   # Required for Azure OIDC & Sigstore keyless signing
  contents: read
  security-events: write

jobs:
  test-and-lint:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and dependencies
        run: |
          pip install --upgrade pip uv ruff mypy pytest pytest-asyncio
          uv pip install --system "pydantic>=2.7.0" "httpx>=0.27.0" "asyncpg>=0.29.0" "azure-identity>=1.16.0" "azure-mgmt-resourcegraph>=8.0.0" "neo4j>=5.19.0" "fastmcp>=0.1.0" "mcp>=1.0.0" "uvicorn>=0.30.0" "starlette>=0.38.0" "opentelemetry-api>=1.28.0"

      - name: Lint with Ruff
        run: |
          ruff check connectors/ resolver/ writer/ risk/ mcp/ || true

      - name: Type check with Mypy
        run: |
          mypy --ignore-missing-imports connectors/ resolver/ writer/ risk/ mcp/ || true

      - name: Run Unit Tests
        env:
          PYTHONPATH: mcp:.
        run: |
          pytest connectors/ resolver/ writer/ risk/ mcp/context_graph/tests/ -v

  build-and-sign:
    name: Build, Scan & Cosign (${{ matrix.name }})
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      REGISTRY: crcontextgraphnonprodhf3i3.azurecr.io
    strategy:
      matrix:
        include:
          - name: connector-azure
            dockerfile: connectors/Dockerfile.azure
            image: crcontextgraphnonprodhf3i3.azurecr.io/connector-azure
          - name: connector-solarwinds
            dockerfile: connectors/Dockerfile.solarwinds
            image: crcontextgraphnonprodhf3i3.azurecr.io/connector-solarwinds
          - name: graph-writer
            dockerfile: writer/Dockerfile
            image: crcontextgraphnonprodhf3i3.azurecr.io/graph-writer
          - name: context-graph-mcp
            dockerfile: mcp/Dockerfile
            image: crcontextgraphnonprodhf3i3.azurecr.io/context-graph-mcp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@v3.8.0

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name crcontextgraphnonprodhf3i3

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Sign Image with Sigstore Cosign (Keyless)
        run: |
          cosign sign --yes ${{ matrix.image }}:${{ github.sha }}
          cosign sign --yes ${{ matrix.image }}:latest
