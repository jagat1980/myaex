name: CI - Application Containers & Security Gates

on:
  push:
    branches: [ main ]
    paths:
      - 'connectors/**'
      - 'mcp/**'
      - 'resolver/**'
      - 'writer/**'
      - 'risk/**'
      - 'Dockerfile*'
      - '.github/workflows/ci-containers.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'connectors/**'
      - 'mcp/**'
      - 'resolver/**'
      - 'writer/**'
      - 'risk/**'
      - 'Dockerfile*'
      - '.github/workflows/ci-containers.yml'

permissions:
  id-token: write   # Required for Azure OIDC & Sigstore keyless signing
  contents: read
  security-events: write

jobs:
  test-and-lint:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and dependencies
        run: |
          pip install --upgrade pip uv ruff mypy pytest pytest-asyncio asyncpg httpx pydantic azure-identity azure-mgmt-resourcegraph
          if [ -f pyproject.toml ]; then
            uv pip install --system -e .
          fi

      - name: Lint with Ruff
        run: |
          ruff check connectors/ || true

      - name: Type check with Mypy
        run: |
          mypy --ignore-missing-imports connectors/ || true

      - name: Run Unit Tests
        run: |
          pytest connectors/ -v

  build-and-sign:
    name: Build, Scan & Cosign Images
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      REGISTRY: crcontextgraphnonprodhf3i3.azurecr.io
    strategy:
      matrix:
        include:
          - name: connector-azure
            dockerfile: connectors/Dockerfile.azure
            image: crcontextgraphnonprodhf3i3.azurecr.io/connector-azure
          - name: connector-solarwinds
            dockerfile: connectors/Dockerfile.solarwinds
            image: crcontextgraphnonprodhf3i3.azurecr.io/connector-solarwinds
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@v3.8.0

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name crcontextgraphnonprodhf3i3

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Sign Image with Sigstore Cosign (Keyless)
        run: |
          cosign sign --yes ${{ matrix.image }}:${{ github.sha }}
          cosign sign --yes ${{ matrix.image }}:latest
