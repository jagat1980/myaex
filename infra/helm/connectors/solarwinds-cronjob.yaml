apiVersion: batch/v1
kind: CronJob
metadata:
  name: connector-solarwinds
  namespace: context-graph
  labels:
    app: solarwinds-connector
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: solarwinds-connector
            azure.workload.identity/use: "true"
        spec:
          serviceAccountName: context-graph-sa
          restartPolicy: OnFailure
          containers:
            - name: solarwinds-connector
              image: crcontextgraphnonprodhf3i3.azurecr.io/connector-solarwinds:latest
              imagePullPolicy: Always
              env:
                - name: TENANT_ID
                  value: "t1"
                - name: SOLARWINDS_API_URL
                  value: "https://api.eu-01.cloud.solarwinds.com"
                - name: SOLARWINDS_TOKEN_FILE
                  value: "/mnt/secrets-store/solarwinds-credentials"
                - name: POSTGRES_AUTH_FILE
                  value: "/mnt/secrets-store/postgres-auth"
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 10001
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: secrets-store-inline
                  mountPath: "/mnt/secrets-store"
                  readOnly: true
          volumes:
            - name: secrets-store-inline
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: neo4j-spc
