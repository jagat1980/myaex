# ==============================================================================
# Context Graph – Namespace Network Policies
# Hard safety: Default-deny on all ingress & egress. Only least-privilege flows.
# ==============================================================================

# 1. Default-deny all traffic in namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: context-graph
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 2. Allow egress to CoreDNS in kube-system
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-coredns-egress
  namespace: context-graph
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# 3. Allow Neo4j Bolt port 7687 ingress strictly from graph-writer and context-graph-mcp
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-neo4j-bolt-ingress
  namespace: context-graph
spec:
  podSelector:
    matchLabels:
      app: context-graph
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - graph-writer
                  - context-graph-mcp
                  - risk-loader
      ports:
        - protocol: TCP
          port: 7687
---
# 4. Allow Bolt port 7687 egress from graph-writer and context-graph-mcp to Neo4j
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-neo4j-bolt-egress
  namespace: context-graph
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - graph-writer
          - context-graph-mcp
          - risk-loader
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: context-graph
      ports:
        - protocol: TCP
          port: 7687
---
# 5. Allow egress to PostgreSQL Flexible Server subnet (10.240.16.0/24) on port 5432
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-egress
  namespace: context-graph
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - graph-writer
          - context-graph-mcp
          - risk-loader
          - entity-resolver
          - solarwinds-connector
          - itsm-connector
          - azure-connector
          - bigfix-connector
          - backup-connector
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.240.16.0/24
      ports:
        - protocol: TCP
          port: 5432
---
# 6. Allow HTTPS port 443 egress from connectors to cloud APIs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-connectors-https-egress
  namespace: context-graph
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - azure-connector
          - solarwinds-connector
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
