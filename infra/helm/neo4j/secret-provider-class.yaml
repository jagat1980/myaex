apiVersion: v1
kind: ServiceAccount
metadata:
  name: context-graph-sa
  namespace: context-graph
  annotations:
    azure.workload.identity/client-id: "20e64f89-8453-4843-97bc-3b29cf72b79a"
  labels:
    azure.workload.identity/use: "true"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: neo4j-spc
  namespace: context-graph
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "20e64f89-8453-4843-97bc-3b29cf72b79a"
    keyvaultName: "kv-cg-nonprod-hf3i3"
    cloudName: ""
    objects: |
      array:
        - |
          objectName: neo4j-auth
          objectType: secret
          objectVersion: ""
        - |
          objectName: postgres-auth
          objectType: secret
          objectVersion: ""
        - |
          objectName: solarwinds-credentials
          objectType: secret
          objectVersion: ""
        - |
          objectName: mcp-auth-token
          objectType: secret
          objectVersion: ""
    tenantId: "0c0696f6-cda5-4908-bedf-af3381b78d93"
  secretObjects:
    - secretName: neo4j-auth
      type: Opaque
      data:
        - objectName: neo4j-auth
          key: NEO4J_AUTH
    - secretName: postgres-auth
      type: Opaque
      data:
        - objectName: postgres-auth
          key: POSTGRES_AUTH
    - secretName: solarwinds-credentials
      type: Opaque
      data:
        - objectName: solarwinds-credentials
          key: SOLARWINDS_API_TOKEN
    - secretName: mcp-auth-token
      type: Opaque
      data:
        - objectName: mcp-auth-token
          key: MCP_AUTH_TOKEN
