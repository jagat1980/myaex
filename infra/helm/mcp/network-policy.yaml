apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mcp-http-ingress
  namespace: context-graph
spec:
  podSelector:
    matchLabels:
      app: context-graph-mcp
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3001
